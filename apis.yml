aid: dylibso
name: Dylibso
description: >-
  Dylibso, Inc. is the company behind Extism, the open-source, cross-language
  framework for building with WebAssembly (Wasm). Its focus is AI-driven
  application extensibility: giving developers an off-the-shelf, secure-by-default,
  fully sandboxed plug-in system that is "just a library import away" and runs
  almost anywhere, with idiomatic Host SDKs for JavaScript, Python, Rust, Ruby,
  Go, .NET, PHP, Java, C/C++, OCaml, Haskell, Perl, and Zig. Beyond Extism,
  Dylibso builds Chicory (a native pure-JVM WebAssembly runtime) and Turbo MCP
  (formerly mcp.run / XTP), a standards-compliant, self-hosted Model Context
  Protocol gateway and management platform with OIDC identity integration and
  audit controls. Dylibso is backed by Felicis.
